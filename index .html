<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube IA Generator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:30px;
}

.title h1{
font-size:40px;
margin-bottom:10px;
}

.title p{
color:#94a3b8;
}

.card{
background:#1e293b;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

input,select{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:16px;
background:#334155;
color:white;
}

button{
width:100%;
padding:16px;
margin-top:20px;
border:none;
border-radius:12px;
background:#22c55e;
color:white;
font-size:18px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

button:hover{
transform:scale(1.02);
}

.result{
margin-top:30px;
background:#111827;
padding:20px;
border-radius:15px;
line-height:1.8;
}

.section{
margin-top:20px;
}

.copy-btn{
background:#2563eb;
margin-top:10px;
}

.footer{
text-align:center;
margin-top:30px;
color:#64748b;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<h1>🔥 YouTube IA Generator</h1>
<p>Créer titres viraux, idées thumbnail et hashtags automatiquement</p>
</div>

<div class="card">

<input
id="topic"
type="text"
placeholder="Sujet vidéo (ex: Free Fire, Motivation, Football)">

<select id="style">
<option>Gaming</option>
<option>Vlog</option>
<option>Motivation</option>
<option>Business</option>
<option>Football</option>
<option>Tech</option>
</select>

<button onclick="generateContent()">
⚡ Générer
</button>

<div class="result" id="result" style="display:none;">

<div class="section">
<h2>🎬 Titres Viraux</h2>
<p id="titles"></p>
<button class="copy-btn" onclick="copyText('titles')">
Copier
</button>
</div>

<div class="section">
<h2>🖼️ Idée Thumbnail</h2>
<p id="thumbnail"></p>
<button class="copy-btn" onclick="copyText('thumbnail')">
Copier
</button>
</div>

<div class="section">
<h2>🏷️ Hashtags</h2>
<p id="hashtags"></p>
<button class="copy-btn" onclick="copyText('hashtags')">
Copier
</button>
</div>

<div class="section">
<h2>📝 Description</h2>
<p id="description"></p>
<button class="copy-btn" onclick="copyText('description')">
Copier
</button>
</div>

</div>

</div>

<div class="footer">
Créé avec ❤️ par Ny Rohy
</div>

</div>

<script>

function generateContent(){

let topic =
document.getElementById("topic").value;

let style =
document.getElementById("style").value;

if(topic == ""){
alert("Soraty aloha ny sujet 😄");
return;
}

let titles = `
😱 ${topic} INCROYABLE !\n
🔥 Le secret de ${topic} révélé !\n
🚀 Comment réussir sur ${topic} rapidement\n
😳 Personne ne savait ça sur ${topic}
`;

let thumbnail =
`Gros texte jaune, visage choqué, fond ${style.toLowerCase()}, effet lumière rouge et flèches rouges.`;

let hashtags =
`#${topic.replace(/ /g,'')} #viral #youtube #trend #${style.toLowerCase()}`;

let description =
`Dans cette vidéo ${style.toLowerCase()}, nous allons parler de ${topic}. Regardez jusqu'à la fin pour découvrir des astuces incroyables 🔥`;


document.getElementById("titles")
.innerText = titles;


document.getElementById("thumbnail")
.innerText = thumbnail;


document.getElementById("hashtags")
.innerText = hashtags;


document.getElementById("description")
.innerText = description;


document.getElementById("result")
.style.display = "block";

}

function copyText(id){

let text =
document.getElementById(id).innerText;

navigator.clipboard.writeText(text);

alert("Copié ✅");

}

</script>

</body>
</html>
